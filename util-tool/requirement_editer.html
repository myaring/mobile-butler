<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>명세서 편집기</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280;
    --line: #e3e6eb; --accent: #3b6cf6; --accent-soft: #eaf0ff;
    --ok: #16a34a; --warn: #d97706; --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161b; --card: #1d2027; --text: #e7e9ee; --muted: #9aa1ad;
      --line: #2e323b; --accent: #7c9bff; --accent-soft: #232b45;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 15px; }
  header { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; padding: 10px 16px; flex-wrap: wrap; }
  header .name { font-weight: 700; margin-right: auto; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .dot.dirty { background: var(--warn); }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 7px 14px; border-radius: 8px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.small { padding: 3px 9px; font-size: 13px; }
  button.icon { border: none; background: transparent; color: var(--muted); padding: 4px 6px; }
  button.icon:hover { color: var(--danger); }
  .tabs { display: flex; gap: 4px; }
  .tabs button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 80px; }
  .start { text-align: center; padding: 60px 20px; border: 2px dashed var(--line); border-radius: 16px; background: var(--card); }
  .start.over { border-color: var(--accent); background: var(--accent-soft); }
  .start h1 { font-size: 22px; margin: 0 0 8px; }
  .start p { color: var(--muted); margin: 6px 0; line-height: 1.6; }
  .start button { margin-top: 16px; font-size: 16px; padding: 10px 22px; }
  .doc h1 { font-size: 24px; margin: 8px 0 12px; }
  .doc h2 { font-size: 19px; margin: 28px 0 10px; }
  .doc h3 { font-size: 16px; margin: 20px 0 8px; }
  .doc hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
  .doc blockquote { margin: 6px 0; padding: 6px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; color: var(--text); }
  .doc p { margin: 4px 0; line-height: 1.6; }
  code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }
  .tablewrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; min-width: 720px; }
  th { background: var(--bg); font-size: 13px; color: var(--muted); text-align: left; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { border-bottom: 1px solid var(--line); padding: 2px; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td textarea, td select { width: 100%; border: 1px solid transparent; background: transparent; color: var(--text);
    font: inherit; padding: 6px; border-radius: 6px; resize: none; overflow: hidden; line-height: 1.5; min-width: 70px; }
  td textarea:hover, td select:hover { border-color: var(--line); }
  td textarea:focus, td select:focus { outline: none; border-color: var(--accent); background: var(--card); }
  td.act { width: 32px; text-align: center; vertical-align: middle; }
  .addrow { margin: 8px 0 4px; }
  #raw { width: 100%; min-height: 70vh; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px;
    padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); line-height: 1.6; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 10px 18px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }
  .hint { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="name"><span class="dot" id="dot"></span><span id="fname">명세서 편집기</span></div>
  <div class="tabs hidden" id="tabs">
    <button id="tabTable" class="on">표 편집</button>
    <button id="tabRaw">원문 편집</button>
  </div>
  <button id="openBtn">파일 열기</button>
  <button id="saveBtn" class="primary hidden">저장 (Ctrl+S)</button>
</header>

<main>
  <div class="start" id="start">
    <h1>📋 MD 파일을 열어 주세요</h1>
    <p>요구사항·기능 명세서 같은 md 파일을 열면 표를 바로 고칠 수 있어요.</p>
    <p class="hint">크롬·엣지: 저장하면 원래 파일에 바로 반영돼요.<br>그 외 브라우저: 수정된 파일을 내려받아요.</p>
    <button class="primary" id="startOpen">파일 열기</button>
    <p class="hint">또는 파일을 여기로 끌어다 놓으세요</p>
  </div>
  <div class="doc hidden" id="doc"></div>
  <textarea id="raw" class="hidden" spellcheck="false"></textarea>
  <input type="file" id="fileInput" accept=".md,.markdown,.txt" class="hidden">
</main>
<div class="toast" id="toast"></div>

<script>
/* ===== 마크다운 <-> 데이터 변환 ===== */
function splitRow(line) {
  let s = line.trim();
  if (s.startsWith('|')) s = s.slice(1);
  if (s.endsWith('|') && !s.endsWith('\\|')) s = s.slice(0, -1);
  const cells = []; let cur = '';
  for (let i = 0; i < s.length; i++) {
    if (s[i] === '\\' && s[i + 1] === '|') { cur += '|'; i++; }
    else if (s[i] === '|') { cells.push(cur.trim()); cur = ''; }
    else cur += s[i];
  }
  cells.push(cur.trim());
  return cells;
}
const isSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
function parseMd(md) {
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  const blocks = []; let text = [];
  const flush = () => { if (text.length) { blocks.push({ type: 'text', lines: text }); text = []; } };
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].trim().startsWith('|') && i + 1 < lines.length && isSep(lines[i + 1])) {
      flush();
      const header = splitRow(lines[i]); const rows = [];
      i += 2;
      while (i < lines.length && lines[i].trim().startsWith('|')) {
        const r = splitRow(lines[i]);
        while (r.length < header.length) r.push('');
        rows.push(r.slice(0, header.length)); i++;
      }
      i--;
      blocks.push({ type: 'table', header, rows });
    } else text.push(lines[i]);
  }
  flush();
  return blocks;
}
const cellOut = v => (v || '').replace(/\n+/g, ' ').replace(/\|/g, '\\|').trim();
const rowOut = cells => '|' + cells.map(c => { c = cellOut(c); return c ? ` ${c} ` : ' '; }).join('|') + '|';
function toMd(blocks) {
  const out = [];
  for (const b of blocks) {
    if (b.type === 'text') out.push(...b.lines);
    else {
      out.push(rowOut(b.header));
      out.push('|' + b.header.map(() => '---').join('|') + '|');
      for (const r of b.rows) out.push(rowOut(r));
    }
  }
  return out.join('\n');
}
/* ===== 끝 ===== */

const STATUS = ['작업 전', '작업 중', '완료'];
const PRIORITY = [['🔴', '🔴 꼭 필요'], ['🟡', '🟡 있으면 좋음'], ['⚪', '⚪ 나중에']];

let blocks = [], handle = null, fileName = '명세서.md', dirty = false, mode = 'table';
const $ = id => document.getElementById(id);

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
}
function renderText(lines) {
  let html = '', quote = [];
  const flushQ = () => { if (quote.length) { html += '<blockquote>' + quote.join('<br>') + '</blockquote>'; quote = []; } };
  for (const l of lines) {
    if (/^>\s?/.test(l)) { quote.push(inline(l.replace(/^>\s?/, ''))); continue; }
    flushQ();
    if (!l.trim()) continue;
    const h = l.match(/^(#{1,3})\s+(.*)/);
    if (h) html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    else if (/^-{3,}\s*$/.test(l)) html += '<hr>';
    else html += `<p>${inline(l)}</p>`;
  }
  flushQ();
  return html;
}
function grow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
function makeSelect(opts, value, onChange) {
  const s = document.createElement('select');
  const list = opts.map(o => Array.isArray(o) ? o : [o, o]);
  if (value && !list.some(o => o[0] === value)) list.unshift([value, value]);
  if (!value) list.unshift(['', '—']);
  for (const [v, label] of list) { const o = new Option(label, v); if (v === value) o.selected = true; s.add(o); }
  s.onchange = () => onChange(s.value);
  return s;
}
function nextId(v) {
  const m = (v || '').match(/^([A-Za-z]+-)(\d+)$/);
  return m ? m[1] + String(+m[2] + 1).padStart(m[2].length, '0') : '';
}

function render() {
  const doc = $('doc'); doc.innerHTML = '';
  blocks.forEach(b => {
    if (b.type === 'text') { const d = document.createElement('div'); d.innerHTML = renderText(b.lines); doc.appendChild(d); return; }
    const wrap = document.createElement('div'); wrap.className = 'tablewrap';
    const t = document.createElement('table');
    t.innerHTML = '<thead><tr>' + b.header.map(h => `<th>${inline(h)}</th>`).join('') + '<th></th></tr></thead>';
    const tb = document.createElement('tbody');
    b.rows.forEach((row, ri) => {
      const tr = document.createElement('tr');
      row.forEach((val, ci) => {
        const td = document.createElement('td'); const h = b.header[ci];
        const set = v => { row[ci] = v; markDirty(); };
        if (h.includes('상태')) td.appendChild(makeSelect(STATUS, val, set));
        else if (h.includes('우선순위')) td.appendChild(makeSelect(PRIORITY, val, set));
        else {
          const ta = document.createElement('textarea'); ta.rows = 1; ta.value = val;
          ta.oninput = () => { set(ta.value); grow(ta); };
          td.appendChild(ta); requestAnimationFrame(() => grow(ta));
        }
        tr.appendChild(td);
      });
      const act = document.createElement('td'); act.className = 'act';
      const del = document.createElement('button'); del.className = 'icon'; del.title = '이 줄 삭제'; del.textContent = '✕';
      del.onclick = () => { if (confirm('이 줄을 삭제할까요?')) { b.rows.splice(ri, 1); markDirty(); render(); } };
      act.appendChild(del); tr.appendChild(act); tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t); doc.appendChild(wrap);
    const add = document.createElement('button'); add.className = 'small addrow'; add.textContent = '+ 줄 추가';
    add.onclick = () => {
      const last = b.rows[b.rows.length - 1] || [];
      b.rows.push(b.header.map((h, ci) => h.includes('상태') ? STATUS[0] : nextId(last[ci])));
      markDirty(); render();
    };
    doc.appendChild(add);
  });
}

function markDirty() { dirty = true; $('dot').classList.add('dirty'); }
function markClean() { dirty = false; $('dot').classList.remove('dirty'); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }

function load(text, name, h) {
  blocks = parseMd(text); fileName = name || fileName; handle = h || null;
  $('fname').textContent = fileName; markClean(); mode = 'table';
  $('start').classList.add('hidden'); $('tabs').classList.remove('hidden'); $('saveBtn').classList.remove('hidden');
  setMode('table');
}
function setMode(m) {
  if (m === 'table' && mode === 'raw') blocks = parseMd($('raw').value);
  if (m === 'raw') $('raw').value = toMd(blocks);
  mode = m;
  $('doc').classList.toggle('hidden', m !== 'table'); $('raw').classList.toggle('hidden', m !== 'raw');
  $('tabTable').classList.toggle('on', m === 'table'); $('tabRaw').classList.toggle('on', m === 'raw');
  if (m === 'table') render();
}

async function openFile() {
  if (dirty && !confirm('저장하지 않은 변경이 있어요. 다른 파일을 열까요?')) return;
  if (window.showOpenFilePicker) {
    try {
      const [h] = await showOpenFilePicker({ types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.txt'] } }] });
      const f = await h.getFile(); load(await f.text(), f.name, h);
    } catch (e) { if (e.name !== 'AbortError') toast('파일을 열지 못했어요'); }
  } else $('fileInput').click();
}
$('fileInput').onchange = async e => { const f = e.target.files[0]; if (f) load(await f.text(), f.name, null); e.target.value = ''; };

async function save() {
  if (!blocks.length && mode !== 'raw') return;
  if (mode === 'raw') blocks = parseMd($('raw').value);
  const md = toMd(blocks);
  try {
    if (!handle && window.showSaveFilePicker) {
      handle = await showSaveFilePicker({ suggestedName: fileName, types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }] });
    }
    if (handle) {
      const w = await handle.createWritable(); await w.write(md); await w.close();
      markClean(); toast('✅ 저장했어요 — 원래 파일에 반영됐어요');
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown;charset=utf-8' }));
      a.download = fileName; a.click(); URL.revokeObjectURL(a.href);
      markClean(); toast('⬇️ 수정된 파일을 내려받았어요');
    }
  } catch (e) { if (e.name !== 'AbortError') toast('저장하지 못했어요: ' + e.message); }
}

$('openBtn').onclick = openFile; $('startOpen').onclick = openFile; $('saveBtn').onclick = save;
$('tabTable').onclick = () => setMode('table'); $('tabRaw').onclick = () => setMode('raw');
$('raw').oninput = markDirty;
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } });
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

const start = $('start');
['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); start.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); start.classList.remove('over'); }));
document.addEventListener('drop', async e => {
  const item = e.dataTransfer.items && e.dataTransfer.items[0];
  let h = null;
  if (item && item.getAsFileSystemHandle) { try { h = await item.getAsFileSystemHandle(); } catch (_) {} }
  const f = h ? await h.getFile() : e.dataTransfer.files[0];
  if (f) load(await f.text(), f.name, h && h.kind === 'file' ? h : null);
});
</script>
</body>
</html>
